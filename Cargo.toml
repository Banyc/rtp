[package]
name = "rtp"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
async_async_io = "0.2"
byteorder = "1"
csv = "1"
dre = { git = "https://github.com/Banyc/dre.git", tag = "v0.0.3" }
fec = { git = "https://github.com/Banyc/fec.git", tag = "v0.0.4" }
# fec = { path = "../fec" }
mpudp = { git = "https://github.com/Banyc/mpudp.git", tag = "v0.0.3" }
primitive = { git = "https://github.com/Banyc/primitive.git", tag = "v0.0.59" }
rand = "0.10"
self_assign = { git = "https://github.com/Banyc/self_assign.git", tag = "v0.0.3" }
serde = { version = "1", features = ["derive"] }
tap = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
tokio_chacha20 = { git = "https://github.com/Banyc/tokio_chacha20.git", tag = "v0.0.8" }
tokio_udp = { git = "https://github.com/Banyc/tokio_udp.git", tag = "v0.0.4" }
# tokio_udp = { path = "../tokio_udp" }
udp_listener = { git = "https://github.com/Banyc/udp_listener.git", tag = "v0.0.19" }
# udp_listener = { path = "../udp_listener" }
# The layer-testing kit (`rtp::testkit`, behind `testing`) consumes the
# generic helpers and the impairment instrument from the local harness
# checkout; the optional dependency is activated by the same feature so the
# kit compiles both in-crate (`cargo test --features testing`) and when rtp is
# itself a dependency with `testing` enabled.
netem-test = { git = "https://github.com/Banyc/netem_test.git", tag = "v0.0.2", features = ["test-kit"], optional = true }
# netem-test = { path = "../netem_test/netem-test", features = ["test-kit"], optional = true }

[features]
default = []
testing = ["dep:netem-test"]

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
file_transfer = { git = "https://github.com/Banyc/file_transfer.git", tag = "v0.0.6" }
# The relocated rtp scenario suites (step 5 of the relocation) consume the
# impairment instrument and the generic helpers from the local harness
# checkout behind its `test-kit` feature; the layer kit (`rtp::testkit`) is
# enabled for the same test builds through the self dev-dependency below.
netem-test = { git = "https://github.com/Banyc/netem_test.git", tag = "v0.0.2", features = ["test-kit"] }
# netem-test = { path = "../netem_test/netem-test", features = ["test-kit"] }
rtp = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["full", "test-util"] }

[profile.profiling]
inherits = "release"
debug = true

[lints.clippy]
disallowed_methods = "deny"
